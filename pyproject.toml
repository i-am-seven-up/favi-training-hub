[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "favi-training-hub"
version = "0.1.0"
description = "File-based FAVI research workflow: local pilot, reviewed Modal training"
requires-python = ">=3.11,<3.13"
dependencies = ["PyYAML>=6.0.2,<7", "Pillow>=11.3,<12"]

[project.optional-dependencies]
train = ["torch==2.8.0", "transformers==4.57.1", "peft==0.17.1", "numpy>=1.26,<3", "huggingface-hub>=0.34,<1"]
remote = ["modal>=1.2,<2", "kaggle>=1.7,<3", "huggingface-hub>=0.34,<1"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[project.scripts]
favi = "favi_hub.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: optional offline tiny CLIP/LoRA integration"]

[tool.ruff]
line-length = 110

[tool.hatch.build.targets.wheel]
packages = ["src/favi_hub"]
